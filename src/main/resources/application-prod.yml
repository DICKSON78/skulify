spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/school_wallet}
    username: ${DB_USER:school_wallet}
    password: ${DB_PASSWORD:school_wallet}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8085}
  forward-headers-strategy: framework

skulify:
  pocket-money:
    topup-fee-percent: ${PM_TOPUP_FEE_PERCENT:0.02}
    offline-cap: ${PM_OFFLINE_CAP:10000}
    refund-window-minutes: ${PM_REFUND_WINDOW_MINUTES:30}
    daily-cash-limit: ${PM_DAILY_CASH_LIMIT:50000}
    reconciliation-cron: ${PM_RECONCILIATION_CRON:0 30 2 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.example.school_wallet: INFO
    org.springframework.security: WARN

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:school-wallet}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    super-admin-username: ${SUPER_ADMIN_USERNAME:superadmin}
    super-admin-phone: ${SUPER_ADMIN_PHONE:-+255700000000}
    super-admin-password: ${SUPER_ADMIN_PASSWORD:}
    super-admin-full-name: ${SUPER_ADMIN_FULL_NAME:KADE Super Admin}
  auth:
    password-reset-expose-token: false
    password-reset-minutes: 30
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  automation:
    enabled: ${AUTOMATION_ENABLED:false}
    fee-reminder-cron: ${AUTOMATION_FEE_CRON:'0 0 6 * * *'}
    library-expiry-cron: ${AUTOMATION_LIBRARY_CRON:'0 5 6 * * *'}
    reorder-cron: ${AUTOMATION_REORDER_CRON:'0 10 6 * * *'}
    result-publish-cron: ${AUTOMATION_RESULT_CRON:'0 15 6 * * *'}
    duty-reminder-cron: ${AUTOMATION_DUTY_CRON:'0 20 6 * * *'}
    daily-cron: ${AUTOMATION_DAILY_CRON:'0 25 6 * * *'}
    notification-dispatch-ms: ${AUTOMATION_DISPATCH_MS:900000}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
