services:
  postgres:
    image: postgres:17-alpine
    container_name: school-wallet-postgres
    environment:
      POSTGRES_DB: school_wallet
      POSTGRES_USER: school_wallet
      POSTGRES_PASSWORD: ${DB_PASSWORD:-school_wallet}
    ports:
      - "5432:5432"
    volumes:
      - school-wallet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_wallet -d school_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: school-wallet-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/school_wallet
      DB_USER: school_wallet
      DB_PASSWORD: ${DB_PASSWORD:-school_wallet}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your environment}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8085}
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED:-false}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-superadmin}
      SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE:-+255700000000}
      SUPER_ADMIN_FULL_NAME: ${SUPER_ADMIN_FULL_NAME:-KADE Super Admin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  school-wallet-pgdata:
